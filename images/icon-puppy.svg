  <circle cx="20.1" cy="20.4" r="0.7" fill="#fff"/>
  <circle cx="29.1" cy="20.4" r="0.7" fill="#fff"/>
  <!-- nose + smile -->
  <ellipse cx="24" cy="27" rx="2.4" ry="1.8" fill="#4a3320"/>
  <path d="M24 29 Q24 32 21 32 M24 29 Q24 32 27 32" stroke="#8a5e30" stroke-width="1.6" fill="none" stroke-linecap="round"/>
