<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" width="1440" height="520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A warm storybook horizon at golden hour: a soft glowing sky, layered rolling hills, trees, a little home with a lit window, a person walking a dog, and a small bunny in the grass.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f7ead3"/>
      <stop offset="0.5"  stop-color="#f7e3c8"/>
      <stop offset="0.8"  stop-color="#f4dcbb"/>
      <stop offset="1"    stop-color="#f2d9b4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#f7d58a" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#f4c871" stop-opacity="0.4"/>
      <stop offset="1"   stop-color="#f4c871" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead9b4"/>
      <stop offset="1" stop-color="#e2cda0"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc292"/>
      <stop offset="1" stop-color="#d0b27c"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7a468"/>
      <stop offset="1" stop-color="#bd9a60"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="1440" height="520" fill="url(#skyGrad)"/>

  <!-- soft sun + glow, high right -->
  <circle cx="1230" cy="120" r="240" fill="url(#sunGlow)"/>
  <circle cx="1230" cy="120" r="48"  fill="#f3cf7e"/>

  <!-- soft clouds, high and to the sides -->
  <g fill="#fcf2e1" opacity="0.75">
    <ellipse cx="210" cy="90" rx="80" ry="22"/>
    <ellipse cx="262" cy="82" rx="52" ry="18"/>
  </g>
  <g fill="#fcf2e1" opacity="0.55">
    <ellipse cx="1040" cy="70" rx="60" ry="17"/>
    <ellipse cx="1082" cy="64" rx="40" ry="14"/>
  </g>

  <!-- a few birds -->
  <g stroke="#b58a4e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M330 110 q11 -11 22 0 q11 -11 22 0"/>
    <path d="M390 92 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- ================= LANDSCAPE in the LOWER THIRD ================= -->
  <path d="M0 360 Q 360 322 720 352 T 1440 342 V520 H0 Z" fill="url(#hillFar)"/>
  <path d="M0 400 Q 320 356 680 392 Q 1040 428 1440 388 V520 H0 Z" fill="url(#hillMid)"/>

  <!-- trees to the sides -->
  <g>
    <rect x="236" y="372" width="9" height="40" rx="3" fill="#8a5e30"/>
    <circle cx="240" cy="364" r="28" fill="#8bae72"/>
    <circle cx="219" cy="372" r="19" fill="#9cbd82"/>
    <circle cx="261" cy="372" r="19" fill="#7fa46a"/>
  </g>
  <g>
    <rect x="1196" y="388" width="8" height="36" rx="3" fill="#8a5e30"/>
    <circle cx="1200" cy="382" r="25" fill="#8bae72"/>
    <circle cx="1181" cy="388" r="17" fill="#9cbd82"/>
  </g>

  <!-- the little HOME, centered low -->
  <g>
    <ellipse cx="720" cy="430" rx="140" ry="16" fill="#9a7a44" opacity="0.16"/>
    <circle cx="738" cy="398" r="76" fill="#f4c871" opacity="0.16"/>
    <rect x="654" y="372" width="132" height="70" rx="7" fill="#f8f0e4" stroke="#c49a63" stroke-width="3"/>
    <path d="M642 374 L720 330 L798 374 Z" fill="#b5713f" stroke="#9a5e30" stroke-width="3" stroke-linejoin="round"/>
    <rect x="762" y="344" width="14" height="22" rx="2" fill="#9a5e30"/>
    <path d="M769 340 q-9 -10 0 -19 q9 -7 2 -17" fill="none" stroke="#e8dcc8" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
    <rect x="694" y="406" width="30" height="36" rx="5" fill="#9a6a34"/>
    <circle cx="718" cy="424" r="2.6" fill="#f4c871"/>
    <rect x="734" y="392" width="34" height="28" rx="4" fill="#f6cf7d" stroke="#c49a63" stroke-width="2.6"/>
    <line x1="751" y1="392" x2="751" y2="420" stroke="#c49a63" stroke-width="2"/>
    <line x1="734" y1="406" x2="768" y2="406" stroke="#c49a63" stroke-width="2"/>
  </g>

  <!-- near hill -->
  <path d="M0 450 Q 380 410 760 446 Q 1120 482 1440 440 V520 H0 Z" fill="url(#hillNear)"/>

  <!-- ===== PERSON WALKING A DOG (left-of-center, on the near hill) ===== -->
  <g>
    <!-- soft shadow -->
    <ellipse cx="462" cy="502" rx="26" ry="5" fill="#9a7a44" opacity="0.2"/>
    <!-- person: gentle stroll -->
    <!-- back leg -->
    <path d="M458 478 L451 500" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/>
    <!-- front leg -->
    <path d="M458 478 L467 500" stroke="#8a5e30" stroke-width="5" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M458 478 L460 452" stroke="#9a6a34" stroke-width="10" stroke-linecap="round"/>
    <!-- arm reaching down to leash -->
    <path d="M460 458 L476 474" stroke="#9a6a34" stroke-width="5" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="461" cy="445" r="8.5" fill="#e3b680" stroke="#b58a4e" stroke-width="1.5"/>
    <!-- leash -->
    <path d="M476 474 Q 493 484 505 483" stroke="#7a5230" stroke-width="1.8" fill="none"/>
    <!-- dog (walking alongside) -->
    <g>
      <ellipse cx="522" cy="488" rx="16" ry="8.5" fill="#8a5e30"/>        <!-- body -->
      <circle cx="537" cy="482" r="6.5" fill="#8a5e30"/>                   <!-- head -->
      <path d="M534 477 q-4 -6 1 -10 q4 2 3 9 Z" fill="#7a5230"/>          <!-- ear -->
      <circle cx="540" cy="481" r="1.2" fill="#3a2818"/>                   <!-- eye -->
      <ellipse cx="543" cy="483" rx="1.6" ry="1.2" fill="#3a2818"/>        <!-- snout -->
      <rect x="511" y="492" width="3" height="9" rx="1.5" fill="#7a5230"/>
      <rect x="519" y="492" width="3" height="9" rx="1.5" fill="#8a5e30"/>
      <rect x="527" y="492" width="3" height="9" rx="1.5" fill="#7a5230"/>
      <path d="M507 485 q-7 -3 -8 -9" stroke="#8a5e30" stroke-width="3.4" fill="none" stroke-linecap="round"/> <!-- tail up -->
    </g>
  </g>

  <!-- ===== LITTLE BUNNY (right foreground) ===== -->
  <g>
    <ellipse cx="1078" cy="498" rx="20" ry="4" fill="#9a7a44" opacity="0.18"/> <!-- shadow -->
    <ellipse cx="1082" cy="490" rx="15" ry="11" fill="#bfa078"/>   <!-- body -->
    <circle cx="1095" cy="481" r="8" fill="#bfa078"/>              <!-- head -->
    <path d="M1092 475 q-2 -12 2 -16 q4 4 2 15 Z" fill="#bfa078"/> <!-- ear -->
    <path d="M1097 475 q1 -11 5 -13 q2 4 -1 13 Z" fill="#bfa078"/> <!-- ear -->
    <circle cx="1098" cy="480" r="1.4" fill="#4a3320"/>           <!-- eye -->
    <circle cx="1066" cy="490" r="4.5" fill="#d6c2a2"/>           <!-- fluffy tail -->
  </g>

  <!-- foreground flowers -->
  <g stroke="#a6854f" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="472" x2="110" y2="458"/><circle cx="110" cy="454" r="4" fill="#dd9a6a" stroke="none"/>
    <line x1="140" y1="478" x2="140" y2="464"/><circle cx="140" cy="460" r="4" fill="#f4c871" stroke="none"/>
    <line x1="1310" y1="470" x2="1310" y2="456"/><circle cx="1310" cy="452" r="4" fill="#dd9a6a" stroke="none"/>
    <line x1="1338" y1="476" x2="1338" y2="462"/><circle cx="1338" cy="458" r="4" fill="#f4c871" stroke="none"/>
  </g>
</svg>
