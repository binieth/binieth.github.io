<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" width="1440" height="620" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A soft hand-drawn storybook landscape at golden hour that fades in at the top and dissolves at the bottom: gentle rolling hills, trees, a person walking a dog, a bunny, and a dimensional cottage with glowing windows.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ead3"/>
      <stop offset="0.42" stop-color="#f7ead3"/>
      <stop offset="0.72" stop-color="#f4ddbd"/>
      <stop offset="1" stop-color="#efd9b4"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7d58a" stop-opacity="0.8"/><stop offset="0.5" stop-color="#f4c871" stop-opacity="0.3"/><stop offset="1" stop-color="#f4c871" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7d4ac" stop-opacity="0"/><stop offset="0.22" stop-color="#e7d4ac" stop-opacity="1"/><stop offset="1" stop-color="#e2cda0"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc292" stop-opacity="0"/><stop offset="0.24" stop-color="#dcc292" stop-opacity="1"/><stop offset="1" stop-color="#d2b480"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbaa6e" stop-opacity="0"/><stop offset="0.26" stop-color="#cbaa6e" stop-opacity="1"/><stop offset="1" stop-color="#c2a062"/>
    </linearGradient>
    <linearGradient id="botFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6d6" stop-opacity="0"/><stop offset="0.65" stop-color="#f0e6d6" stop-opacity="0.75"/><stop offset="1" stop-color="#f0e6d6" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="620" fill="url(#skyGrad)"/>
  <circle cx="1230" cy="150" r="250" fill="url(#sunGlow)"/>
  <circle cx="1230" cy="150" r="44" fill="#f3cf7e" opacity="0.8"/>

  <g fill="#fcf2e1" opacity="0.6"><ellipse cx="230" cy="110" rx="80" ry="22"/><ellipse cx="286" cy="102" rx="52" ry="17"/></g>
  <g fill="#fcf2e1" opacity="0.42"><ellipse cx="1040" cy="92" rx="56" ry="15"/><ellipse cx="1080" cy="86" rx="36" ry="12"/></g>
  <g stroke="#b58a4e" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.5"><path d="M340 134 q10 -10 20 0 q10 -10 20 0"/><path d="M392 118 q8 -8 16 0 q8 -8 16 0"/></g>

  <path d="M0 372 Q 360 334 720 362 T 1440 350 V620 H0 Z" fill="url(#hillFar)"/>
  <path d="M0 424 Q 320 380 680 416 Q 1040 452 1440 412 V620 H0 Z" fill="url(#hillMid)"/>

  <g><rect x="236" y="410" width="9" height="42" rx="4" fill="#8a5e30"/><circle cx="240" cy="402" r="28" fill="#8bae72"/><circle cx="219" cy="410" r="19" fill="#9cbd82"/><circle cx="261" cy="410" r="19" fill="#7fa46a"/></g>
  <g><rect x="1198" y="424" width="8" height="38" rx="3" fill="#8a5e30"/><circle cx="1202" cy="418" r="25" fill="#8bae72"/><circle cx="1183" cy="424" r="17" fill="#9cbd82"/></g>

  <!-- flat 2D storybook cottage, scaled and centered -->
  <g transform="translate(588,318) scale(0.92)">

  <defs>
    <linearGradient id="c_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf4e8"/><stop offset="1" stop-color="#f1e3cd"/>
    </linearGradient>
    <linearGradient id="c_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47c44"/><stop offset="1" stop-color="#a5632f"/>
    </linearGradient>
    <linearGradient id="c_win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a0"/><stop offset="1" stop-color="#f6cf7d"/>
    </linearGradient>
    <radialGradient id="c_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity="0.7"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="130" cy="214" rx="104" ry="12" fill="#6e5230" opacity="0.15"/>

  <!-- chimney (behind roof) -->
  <rect x="176" y="40" width="20" height="44" rx="2" fill="#9a5e30" stroke="#7a4420" stroke-width="2"/>
  <rect x="172" y="36" width="28" height="9" rx="2" fill="#b5713f" stroke="#7a4420" stroke-width="2"/>
  <path d="M186 34 q-9 -11 0 -20 q9 -6 2 -18" fill="none" stroke="#e8dcc8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- roof (pitched triangle with a little overhang) -->
  <polygon points="40,96 130,34 220,96" fill="url(#c_roof)" stroke="#7a4420" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="30,98 130,30 230,98 220,104 40,104" fill="url(#c_roof)" stroke="#7a4420" stroke-width="2" stroke-linejoin="round"/>
  <!-- roof shading lines -->
  <g stroke="#8a4e24" stroke-width="1.2" opacity="0.4">
    <line x1="70" y1="86" x2="130" y2="46"/><line x1="100" y1="86" x2="130" y2="66"/>
    <line x1="160" y1="86" x2="130" y2="46"/><line x1="130" y1="86" x2="130" y2="66"/>
  </g>

  <!-- walls -->
  <rect x="54" y="104" width="152" height="104" fill="url(#c_wall)" stroke="#8a5e30" stroke-width="2.6"/>

  <!-- round-top door -->
  <path d="M104 208 L104 150 Q104 134 130 134 Q156 134 156 150 L156 208 Z" fill="#9a6a34" stroke="#7a4f28" stroke-width="2.4"/>
  <line x1="130" y1="134" x2="130" y2="208" stroke="#7a4f28" stroke-width="1.4" opacity="0.5"/>
  <circle cx="148" cy="172" r="2.6" fill="#ffd982"/>

  <!-- windows with glow + cross bars + little shutters -->
  <g>
    <circle cx="82" cy="140" r="22" fill="url(#c_glow)"/>
    <rect x="68" y="126" width="28" height="28" rx="2" fill="url(#c_win)" stroke="#8a5e30" stroke-width="2.2"/>
    <line x1="82" y1="126" x2="82" y2="154" stroke="#8a5e30" stroke-width="1.6"/>
    <line x1="68" y1="140" x2="96" y2="140" stroke="#8a5e30" stroke-width="1.6"/>
  </g>
  <g>
    <circle cx="178" cy="140" r="22" fill="url(#c_glow)"/>
    <rect x="164" y="126" width="28" height="28" rx="2" fill="url(#c_win)" stroke="#8a5e30" stroke-width="2.2"/>
    <line x1="178" y1="126" x2="178" y2="154" stroke="#8a5e30" stroke-width="1.6"/>
    <line x1="164" y1="140" x2="192" y2="140" stroke="#8a5e30" stroke-width="1.6"/>
  </g>

  <!-- little heart in the gable -->
  <path d="M130 86 q-6 -7 -12 -2 q-5 4 0 9 l12 11 l12 -11 q5 -5 0 -9 q-6 -5 -12 2 Z" fill="#dd9a6a" opacity="0.9"/>

  </g>

  <path d="M0 482 Q 380 444 760 480 Q 1120 516 1440 474 V620 H0 Z" fill="url(#hillNear)" opacity="0.95"/>

  <!-- person + dog -->
  <g>
    <ellipse cx="462" cy="532" rx="26" ry="5" fill="#9a7a44" opacity="0.2"/>
    <path d="M458 508 L451 530" stroke="#7a5230" stroke-width="5" stroke-linecap="round"/><path d="M458 508 L467 530" stroke="#8a5e30" stroke-width="5" stroke-linecap="round"/>
    <path d="M458 508 L460 482" stroke="#9a6a34" stroke-width="10" stroke-linecap="round"/><path d="M460 488 L476 504" stroke="#9a6a34" stroke-width="5" stroke-linecap="round"/>
    <circle cx="461" cy="475" r="8.5" fill="#e3b680" stroke="#b58a4e" stroke-width="1.5"/>
    <path d="M476 504 Q 493 514 505 513" stroke="#7a5230" stroke-width="1.8" fill="none"/>
    <g><ellipse cx="522" cy="518" rx="16" ry="8.5" fill="#8a5e30"/><circle cx="537" cy="512" r="6.5" fill="#8a5e30"/><path d="M534 507 q-4 -6 1 -10 q4 2 3 9 Z" fill="#7a5230"/><circle cx="540" cy="511" r="1.2" fill="#3a2818"/><ellipse cx="543" cy="513" rx="1.6" ry="1.2" fill="#3a2818"/><rect x="511" y="522" width="3" height="9" rx="1.5" fill="#7a5230"/><rect x="519" y="522" width="3" height="9" rx="1.5" fill="#8a5e30"/><rect x="527" y="522" width="3" height="9" rx="1.5" fill="#7a5230"/><path d="M507 515 q-7 -3 -8 -9" stroke="#8a5e30" stroke-width="3.4" fill="none" stroke-linecap="round"/></g>
  </g>

  <!-- bunny -->
  <g>
    <ellipse cx="1078" cy="528" rx="20" ry="4" fill="#9a7a44" opacity="0.18"/>
    <ellipse cx="1082" cy="520" rx="15" ry="11" fill="#bfa078"/><circle cx="1095" cy="511" r="8" fill="#bfa078"/>
    <path d="M1092 505 q-2 -12 2 -16 q4 4 2 15 Z" fill="#bfa078"/><path d="M1097 505 q1 -11 5 -13 q2 4 -1 13 Z" fill="#bfa078"/>
    <circle cx="1098" cy="510" r="1.4" fill="#4a3320"/><circle cx="1066" cy="520" r="4.5" fill="#d6c2a2"/>
  </g>

  <g stroke="#a6854f" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="532" x2="110" y2="518"/><circle cx="110" cy="514" r="4" fill="#dd9a6a" stroke="none"/>
    <line x1="140" y1="538" x2="140" y2="524"/><circle cx="140" cy="520" r="4" fill="#f4c871" stroke="none"/>
    <line x1="1312" y1="530" x2="1312" y2="516"/><circle cx="1312" cy="512" r="4" fill="#dd9a6a" stroke="none"/>
    <line x1="1340" y1="536" x2="1340" y2="522"/><circle cx="1340" cy="518" r="4" fill="#f4c871" stroke="none"/>
  </g>

  <rect x="0" y="500" width="1440" height="120" fill="url(#botFade)"/>
</svg>
