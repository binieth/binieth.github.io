<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240" role="img" aria-label="A warm flat storybook cottage: a cozy house with a pitched roof, a chimney, a round-top door, and glowing windows.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcf4e8"/><stop offset="1" stop-color="#f1e3cd"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47c44"/><stop offset="1" stop-color="#a5632f"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a0"/><stop offset="1" stop-color="#f6cf7d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity="0.7"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="130" cy="214" rx="104" ry="12" fill="#6e5230" opacity="0.15"/>

  <!-- chimney (behind roof) -->
  <rect x="176" y="40" width="20" height="44" rx="2" fill="#9a5e30" stroke="#7a4420" stroke-width="2"/>
  <rect x="172" y="36" width="28" height="9" rx="2" fill="#b5713f" stroke="#7a4420" stroke-width="2"/>
  <path d="M186 34 q-9 -11 0 -20 q9 -6 2 -18" fill="none" stroke="#e8dcc8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- roof (pitched triangle with a little overhang) -->
  <polygon points="40,96 130,34 220,96" fill="url(#roof)" stroke="#7a4420" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="30,98 130,30 230,98 220,104 40,104" fill="url(#roof)" stroke="#7a4420" stroke-width="2" stroke-linejoin="round"/>
  <!-- roof shading lines -->
  <g stroke="#8a4e24" stroke-width="1.2" opacity="0.4">
    <line x1="70" y1="86" x2="130" y2="46"/><line x1="100" y1="86" x2="130" y2="66"/>
    <line x1="160" y1="86" x2="130" y2="46"/><line x1="130" y1="86" x2="130" y2="66"/>
  </g>

  <!-- walls -->
  <rect x="54" y="104" width="152" height="104" fill="url(#wall)" stroke="#8a5e30" stroke-width="2.6"/>

  <!-- round-top door -->
  <path d="M104 208 L104 150 Q104 134 130 134 Q156 134 156 150 L156 208 Z" fill="#9a6a34" stroke="#7a4f28" stroke-width="2.4"/>
  <line x1="130" y1="134" x2="130" y2="208" stroke="#7a4f28" stroke-width="1.4" opacity="0.5"/>
  <circle cx="148" cy="172" r="2.6" fill="#ffd982"/>

  <!-- windows with glow + cross bars + little shutters -->
  <g>
    <circle cx="82" cy="140" r="22" fill="url(#glow)"/>
    <rect x="68" y="126" width="28" height="28" rx="2" fill="url(#win)" stroke="#8a5e30" stroke-width="2.2"/>
    <line x1="82" y1="126" x2="82" y2="154" stroke="#8a5e30" stroke-width="1.6"/>
    <line x1="68" y1="140" x2="96" y2="140" stroke="#8a5e30" stroke-width="1.6"/>
  </g>
  <g>
    <circle cx="178" cy="140" r="22" fill="url(#glow)"/>
    <rect x="164" y="126" width="28" height="28" rx="2" fill="url(#win)" stroke="#8a5e30" stroke-width="2.2"/>
    <line x1="178" y1="126" x2="178" y2="154" stroke="#8a5e30" stroke-width="1.6"/>
    <line x1="164" y1="140" x2="192" y2="140" stroke="#8a5e30" stroke-width="1.6"/>
  </g>

  <!-- little heart in the gable -->
  <path d="M130 86 q-6 -7 -12 -2 q-5 4 0 9 l12 11 l12 -11 q5 -5 0 -9 q-6 -5 -12 2 Z" fill="#dd9a6a" opacity="0.9"/>
</svg>
